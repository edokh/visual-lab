<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/back-nav.css" />

    <title>مختبر VisualLab - قائمة التجارب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            padding: 22px;
            min-height: 80vh;
        }

        h1 {
            font-size: 1.5rem;
            color: #88ccff;
            margin-bottom: 8px;
        }

        .sub {
            color: #99aacc;
            margin-bottom: 18px;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
            margin-top: 2rem;
        }

        .card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: #141428;
            border: 1px solid #2a2a4a;
            padding: 14px;
            transition: border-color 0.15s ease, transform 0.15s ease;
            cursor: pointer;
        }

        .card:hover {
            border-color: #4a8cff;
            transform: translateY(-2px);
        }

        .card h2 {
            font-size: 1rem;
            color: #b8e2ff;
            margin-bottom: 8px;
        }

        .card p {
            color: #b0c3dc;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 12px;
            min-height: 64px;
        }

        .tip {
            margin-top: 14px;
            color: #88ddff;
            font-size: 0.8rem;
            background: #1a1a30;
            border: 1px solid #2a2a4a;
            padding: 8px 10px;
        }
    </style>
</head>

<body>
    <div class="page">
        <a class="vl-back" href="chapters.html" aria-label="العودة">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="back_icon">
                <path stroke-linecap="round" stroke-width="2.5" stroke-linejoin="round"
                    d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
            </svg>
        </a>
        <h1>VisualLab - قائمة التجارب</h1>
        <div class="grid">
            <a class="card" href="electromagnetic-waves-lab.html" aria-label="فتح تجربة الموجات الكهرومغناطيسية">
                <h2>الموجات الكهرومغناطيسية</h2>
                <p>تجربة الحقول الكهربائية والمغناطيسية وتأثيرها على مسار جسيم مشحون.</p>
            </a>
            <a class="card" href="generation-of-electromagnetic-waves-from-accelerated-charges.html" aria-label="فتح تجربة توليد الموجات الكهرومغناطيسية من الشحنات المعجلة">
                <h2>توليد الموجات الكهرومغناطيسية من الشحنات المعجلة</h2>
                <p>تجربة توضيح كيفية توليد الموجات الكهرومغناطيسية من الشحنات المعجلة.</p>
            </a>
        </div>
    </div>
</body>

</html>
